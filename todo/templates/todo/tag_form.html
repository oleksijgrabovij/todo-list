{% extends "todo/base.html" %}

{% block content %}
<div class="mb-4">
    <h1>Create Tag</h1>
</div>

<form action="" method="post">
    {% csrf_token %}
    <!-- Form fields generated by Django -->
    {{ form.as_p }}
    
    <input type="submit" value="Save" class="btn btn-success">
    <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
