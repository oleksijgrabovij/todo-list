{% extends "todo/base.html" %}

{% block content %}
<div class="mb-4">
    <h1>{% if form.instance.pk %}Update{% else %}Create{% endif %} Tag</h1>
</div>

<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body">
        <form action="" method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="mt-3">
                <input type="submit" value="Save" class="btn btn-success">
                <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
