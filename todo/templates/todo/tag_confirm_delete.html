{% extends "todo/base.html" %}

{% block content %}
<div class="mb-4">
    <h1>Delete Tag</h1>
</div>

<div class="card shadow-sm border-danger" style="max-width: 500px;">
    <div class="card-body">
        <p class="fs-5">Are you sure you want to delete the tag <strong>"{{ tag.name }}"</strong>?</p>
        
        <form action="" method="post">
            {% csrf_token %}
            <div class="mt-4">
                <input type="submit" value="Yes, delete" class="btn btn-danger">
                <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
