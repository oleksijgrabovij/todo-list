{% extends "todo/base.html" %}

{% block content %}
<div class="mb-4">
    <h1>Create Task</h1>
</div>

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form action="" method="post">
            {% csrf_token %}

            <!-- Loop through form fields for custom Bootstrap styling -->
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>

                    {% if field.name == "tags" %}
                        <!-- Special layout for CheckboxSelectMultiple -->
                        <div class="border rounded p-2">
                            {{ field }}
                        </div>
                    {% else %}
                        <!-- Standard input layout -->
                        {{ field }}
                    {% endif %}

                    <!-- Display validation errors if any -->
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="mt-4">
                <input type="submit" value="Save" class="btn btn-success">
                <a href="{% url 'todo:task-list' %}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
